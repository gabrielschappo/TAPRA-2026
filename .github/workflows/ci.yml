name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ferramentas de qualidade
        run: pip install -r requirements-dev.txt

      - name: Verificar sintaxe
        run: python -m py_compile function_app.py

      - name: Linting (ruff)
        run: ruff check .

      - name: Formatacao (black)
        run: black --check --diff .

      - name: Ordem dos imports (isort)
        run: isort --check-only --diff .
